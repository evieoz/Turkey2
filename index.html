
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macklin Celebirdie | San Jose Sharks</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <p class="eyebrow">SAN JOSE SHARKS • #71</p>
        <h1>Macklin Celebirdie</h1>
        <p class="subtitle">Too busy scoring to be Thanksgiving dinner.</p>
    </header>

    <div class="rink">
        <div class="center-line"></div>
        <div class="center-circle"></div>
    </div>

    <div class="turkey">

        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>
        <div class="tail"></div>

        <div class="leg"></div>
        <div class="leg"></div>

        <div class="skate skate-left"></div>
        <div class="skate skate-right"></div>

        <div class="body">
            <div class="collar"></div>
            <div class="jersey-name">CELEBRINI</div>
            <div class="jersey-number">71</div>
            <div class="jersey-stripe"></div>
        </div>

        <div class="wing"></div>
        <div class="wing"></div>

        <div class="head">
            <div class="eye"></div>
            <div class="beak"></div>
            <div class="red"></div>
        </div>

        <div class="hat-top">
            <span>71</span>
        </div>

        <div class="hat-bottom"></div>
        <div class="visor"></div>

        <div class="stick"></div>
        <div class="glove"></div>
        <div class="puck"></div>

    </div>

    <footer>
        <span>SAN JOSE</span>
        <span class="footer-number">71</span>
        <span>FEAR THE FIN</span>
    </footer>

</body>

</html>
